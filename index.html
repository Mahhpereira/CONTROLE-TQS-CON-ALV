<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f8; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 1.5rem; text-align: center; color: #2c3e50; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        .nav-bar { display: flex; overflow-x: auto; background: #2d3748; border-radius: 8px; margin-bottom: 20px; padding: 5px; }
        .nav-bar button { flex: 1; background: none; color: #cbd5e0; border: none; padding: 12px 15px; cursor: pointer; white-space: nowrap; font-size: 0.9rem; border-radius: 5px; transition: 0.3s; }
        .nav-bar button:hover { color: white; }
        .nav-bar button.active { background: #4a5568; color: white; font-weight: bold; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 15px; background: white; }
        .form-section { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; }
        
        label { font-weight: bold; font-size: 0.85rem; margin-top: 10px; display: block; color: #4a5568; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: inherit; }
        
        .status { font-weight: bold; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; display: inline-block; margin-bottom: 10px; }
        .status.em-uso { background-color: #fefcbf; color: #b7791f; }
        .status.livre { background-color: #c6f6d5; color: #22543d; }
        
        .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .btn-dark { background-color: #2d3748; color: white; }
        .btn-blue { background-color: #3182ce; color: white; }
        .btn-green { background-color: #38a169; color: white; }
        .info { font-size: 0.9rem; margin: 5px 0; color: #4a5568; }
        
        .table-container { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; font-size: 0.85rem; }
        th { background-color: #4a5568; color: white; padding: 10px; text-align: left; border: 1px solid #2d3748; }
        td { padding: 8px 10px; border: 1px solid #e2e8f0; }
        .td-concluido { background-color: #c6f6d5; color: #22543d; font-weight: bold; text-align: center; }
        .td-pendente { background-color: #fed7d7; color: #9b2c2c; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏗️ Sistema de Gestão</h1>
        
        <div class="nav-bar">
            <button class="active" onclick="mudarAba(event, 'tab-inicio')">📋 Projetos</button>
            <button onclick="mudarAba(event, 'tab-movimentar')">📥 Check-in</button>
            <button onclick="mudarAba(event, 'tab-ficha')">📄 Ficha Técnica</button>
            <button onclick="mudarAba(event, 'tab-reunioes')">🤝 Reuniões</button>
            <button onclick="mudarAba(event, 'tab-lista')">📊 Lista Mestra</button>
        </div>

        <!-- ABA 1: PROJETOS -->
        <div id="tab-inicio" class="tab-content active">
            <h2 style="font-size: 1.2rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px;">Status dos Modelos</h2>
            <div id="lista-projetos"><p style="text-align:center; color:#666;">⏳ Carregando projetos...</p></div>
        </div>

        <!-- ABA 2: CHECK-IN -->
        <div id="tab-movimentar" class="tab-content">
            <div class="form-section">
                <h2 style="margin: 0 0 15px 0; font-size: 1.2rem;">Fazer Check-in (Pegar Projeto)</h2>
                <label>Projeto:</label>
                <input type="text" id="nomeProjeto">
                <label>Modelo:</label>
                <input type="text" id="modeloProjeto">
                <label>Fase:</label>
                <select id="faseProjeto">
                    <option value="">Selecione...</option>
                    <option value="EP">EP - Estudo Preliminar</option>
                    <option value="AP">AP - Anteprojeto</option>
                    <option value="PR">PR - Pré-executivo</option>
                    <option value="EX">EX - Executivo</option>
                    <option value="LO">LO - Liberado Obra</option>
                </select>
                <label>Versão:</label>
                <input type="text" id="versaoProjeto">
                <label>Responsável:</label>
                <input type="text" id="responsavelProjeto">
                <button id="btn-cadastrar" class="btn btn-dark" onclick="cadastrarProjeto()">Registrar Check-in</button>
            </div>
        </div>

        <!-- ABA 3: FICHA TÉCNICA -->
        <div id="tab-ficha" class="tab-content">
            <div class="form-section">
                <h2 style="margin: 0 0 15px 0;">Ficha Técnica</h2>
                <button class="btn btn-blue" onclick="alert('Conexão em breve!')">Salvar</button>
            </div>
        </div>
        
        <!-- ABA 4: REUNIÕES -->
        <div id="tab-reunioes" class="tab-content">
            <div class="form-section">
                <h2 style="margin: 0 0 15px 0;">Reuniões</h2>
                <button class="btn btn-blue" onclick="alert('Conexão em breve!')">Salvar</button>
            </div>
        </div>

        <!-- ABA 5: LISTA MESTRA DINÂMICA -->
        <div id="tab-lista" class="tab-content">
            <h2 style="font-size: 1.2rem; margin-bottom: 5px;">Consulta - Lista Mestra</h2>
            
            <label>Selecione o Empreendimento:</label>
            <select id="filtro-empreendimento" onchange="filtrarLista()">
                <option value="">Aguardando dados...</option>
            </select>
            
            <div class="table-container" style="display:none;" id="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>NOME DO ARQUIVO</th>
                            <th>FOLHA</th>
                            <th>DESCRIÇÃO</th>
                            <th>REVISÃO</th>
                            <th>INÍCIO</th>
                            <th>TÉRMINO</th>
                            <th>PROJETISTA</th>
                            <th>STATUS</th>
                            <th>CADASTRO</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-mestra"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const urlScript = "https://script.google.com/macros/s/AKfycbxzD6GmeW0Zbl-vC4_Q107_guVuxRpI1nqhHsPUXmqfhB8b53CvUEwlzbM6EMIN-uFb/exec";
        let baseListaMestra = []; 

        function mudarAba(evento, idAba) {
            document.querySelectorAll('.tab-content').forEach(aba => aba.classList.remove('active'));
            document.querySelectorAll('.nav-bar button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(idAba).classList.add('active');
            evento.currentTarget.classList.add('active');
        }

        window.onload = function() {
            fetch(urlScript)
                .then(resposta => resposta.json())
                .then(dados => {
                    const lista = document.getElementById('lista-projetos');
                    lista.innerHTML = ""; 
                    if(dados.projetos.length === 0) {
                        lista.innerHTML = "<p style='text-align:center;'>Nenhum projeto cadastrado.</p>";
                    } else {
                        dados.projetos.reverse().forEach(p => { 
                            let isEmUso = p.status.includes('Em uso');
                            let classeStatus = isEmUso ? 'em-uso' : 'livre';
                            let iconeStatus = isEmUso ? '⚠️' : '✅';
                            
                            // Os botões verdes agora se chamam Check-out (Devolver)
                            let botoesDevolver = isEmUso ? `
                                <div style="display:flex; gap:10px; margin-top:15px;">
                                    <button class="btn btn-green" style="margin-top:0;" onclick="devolverProjeto('${p.projeto}', 'CON')">Check-out para TQS CON</button>
                                    <button class="btn btn-green" style="margin-top:0;" onclick="devolverProjeto('${p.projeto}', 'ALV')">Check-out para TQS ALV</button>
                                </div>
                            ` : '';

                            lista.innerHTML += `
                            <div class="card">
                                <span class="status ${classeStatus}">${iconeStatus} ${p.status}</span>
                                <h2 style="margin: 5px 0;">${p.projeto}</h2>
                                <p class="info"><strong>Modelo:</strong> ${p.modelo || '-'}</p>
                                <p class="info"><strong>Fase:</strong> ${p.fase} | <strong>Versão:</strong> ${p.versao} | <strong>Com:</strong> ${p.responsavel}</p>
                                ${botoesDevolver}
                            </div>`;
                        });
                    }

                    baseListaMestra = dados.mestra;
                    const select = document.getElementById('filtro-empreendimento');
                    select.innerHTML = '<option value="">Selecione um projeto...</option>';
                    
                    const nomesUnicos = [...new Set(baseListaMestra.map(item => item.empreendimento))];
                    nomesUnicos.forEach(nome => {
                        if(nome) select.innerHTML += `<option value="${nome}">${nome}</option>`;
                    });
                });
        };

        function filtrarLista() {
            const projetoSelecionado = document.getElementById('filtro-empreendimento').value;
            const container = document.getElementById('tabela-container');
            const tbody = document.getElementById('tbody-mestra');
            tbody.innerHTML = ""; 

            if(!projetoSelecionado) {
                container.style.display = "none";
                return;
            }

            container.style.display = "block";
            const linhasFiltradas = baseListaMestra.filter(item => item.empreendimento === projetoSelecionado);

            linhasFiltradas.forEach(linha => {
                let statusUpper = (linha.status || "").toUpperCase();
                let classeStatus = statusUpper === 'CONCLUÍDO' ? 'td-concluido' : 'td-pendente';
                
                tbody.innerHTML += `
                    <tr>
                        <td>${linha.arquivo || '-'}</td>
                        <td>${linha.folha || '-'}</td>
                        <td>${linha.descricao || '-'}</td>
                        <td>${linha.revisao || '-'}</td>
                        <td>${linha.inicio || '-'}</td>
                        <td>${linha.termino || '-'}</td>
                        <td>${linha.projetista || '-'}</td>
                        <td class="${classeStatus}">${statusUpper}</td>
                        <td style="text-align:center; color:red; font-weight:bold;">${linha.cadastro || ''}</td>
                    </tr>
                `;
            });
        }

        // CADASTRO NOVO (CHECK-IN)
        function cadastrarProjeto() {
            var nome = document.getElementById('nomeProjeto').value;
            var modelo = document.getElementById('modeloProjeto').value;
            var fase = document.getElementById('faseProjeto').value;
            var versao = document.getElementById('versaoProjeto').value;
            var responsavel = document.getElementById('responsavelProjeto').value;
            
            var btn = document.getElementById('btn-cadastrar');
            btn.innerText = "Salvando..."; btn.disabled = true;

            fetch(urlScript, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 
                    'action': 'cadastrar', 
                    'nomeProjeto': nome, 'modelo': modelo, 'fase': fase, 'versao': versao, 'responsavel': responsavel 
                })
            }).then(() => {
                btn.innerText = "Registrar Check-in"; btn.disabled = false;
                alert("Check-in realizado com sucesso!");
                window.location.reload();
            });
        }

        // DEVOLVER PROJETO (CHECK-OUT)
        function devolverProjeto(nomeProjeto, destino) {
            if(!confirm(`Confirma o Check-out (devolução) do projeto "${nomeProjeto}" para o TQS ${destino}?`)) {
                return; 
            }

            let novoStatus = destino === 'CON' ? '✅ Disponível no TQS CON' : '✅ Disponível no TQS ALV';

            fetch(urlScript, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 
                    'action': 'devolver', 
                    'nomeProjeto': nomeProjeto,
                    'novoStatus': novoStatus
                })
            }).then(() => {
                alert("Check-out realizado com sucesso!");
                window.location.reload();
            });
        }
    </script>
</body>
</html>
