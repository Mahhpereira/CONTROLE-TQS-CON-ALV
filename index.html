<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão - Leone Engenharia</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f8; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 1.5rem; text-align: center; color: #2c3e50; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        .nav-bar { display: flex; overflow-x: auto; background: #2d3748; border-radius: 8px; margin-bottom: 20px; padding: 5px; }
        .nav-bar button { flex: 1; background: none; color: #cbd5e0; border: none; padding: 12px 15px; cursor: pointer; white-space: nowrap; font-size: 0.9rem; border-radius: 5px; transition: 0.3s; }
        .nav-bar button:hover { color: white; }
        .nav-bar button.active { background: #4a5568; color: white; font-weight: bold; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 15px; background: white; }
        .form-section { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        
        label { font-weight: bold; font-size: 0.85rem; margin-top: 10px; display: block; color: #4a5568; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: inherit; }
        
        .status { font-weight: bold; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; display: inline-block; margin-bottom: 10px; }
        .status.em-uso { background-color: #fefcbf; color: #b7791f; }
        .status.livre { background-color: #c6f6d5; color: #22543d; }
        
        .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; margin-top: 10px; font-weight: bold; text-decoration: none; text-align: center; }
        .btn-dark { background-color: #2d3748; color: white; }
        .btn-blue { background-color: #3182ce; color: white; }
        .btn-green { background-color: #38a169; color: white; }
        .info { font-size: 0.9rem; margin: 5px 0; color: #4a5568; }
        
        .section-title { background: #4a5568; color: white; padding: 8px 12px; font-size: 0.9rem; font-weight: bold; border-radius: 4px; margin-bottom: 15px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏗️ Sistema de Gestão</h1>
        
        <div class="nav-bar">
            <button class="active" onclick="mudarAba(event, 'tab-inicio')">📋 Projetos</button>
            <button onclick="mudarAba(event, 'tab-movimentar')">📥 Check-in</button>
            <button onclick="mudarAba(event, 'tab-ficha')">📄 Ficha Técnica</button>
            <button onclick="mudarAba(event, 'tab-reunioes')">🤝 Reuniões</button>
        </div>

        <!-- ABA 1: PROJETOS -->
        <div id="tab-inicio" class="tab-content active">
            <h2 style="font-size: 1.2rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px;">Status dos Modelos</h2>
            <div id="lista-projetos"><p style="text-align:center; color:#666;">⏳ Carregando projetos...</p></div>
        </div>

        <!-- ABA 2: CHECK-IN -->
        <div id="tab-movimentar" class="tab-content">
            <div class="form-section">
                <h2 style="margin: 0 0 15px 0; font-size: 1.2rem;">Fazer Check-in (Pegar Projeto)</h2>
                <label>Projeto:</label>
                <input type="text" id="nomeProjeto">
                <label>Modelo:</label>
                <input type="text" id="modeloProjeto">
                <label>Fase:</label>
                <select id="faseProjeto">
                    <option value="">Selecione...</option>
                    <option value="EP">EP - Estudo Preliminar</option>
                    <option value="AP">AP - Anteprojeto</option>
                    <option value="PR">PR - Pré-executivo</option>
                    <option value="EX">EX - Executivo</option>
                    <option value="LO">LO - Liberado Obra</option>
                </select>
                <label>Versão:</label>
                <input type="text" id="versaoProjeto">
                <label>Responsável:</label>
                <input type="text" id="responsavelProjeto">
                <button id="btn-cadastrar" class="btn btn-dark" onclick="cadastrarProjeto()">Registrar Check-in</button>
            </div>
        </div>

        <!-- ABA 3: FICHA TÉCNICA -->
        <div id="tab-ficha" class="tab-content">
            <div class="form-section">
                <h2 style="margin: 0 0 15px 0;">Ficha do Projeto (IPL003)</h2>
                
                <!-- Consulta de Ficha Existente -->
                <label>Consultar Ficha Cadastrada:</label>
                <select id="select-consulta-ficha" onchange="carregarFichaSelecionada()">
                    <option value="">-- Criar nova ficha ou selecionar existente --</option>
                </select>
                <hr style="border:0; border-top:1px solid #cbd5e0; margin: 15px 0;">

                <div class="section-title">1 - Dados de Cadastro</div>
                <label>Nome do Projeto:</label>
                <input type="text" id="ficha-projeto" placeholder="Ex: Casa Borda da Mata">
                
                <label>N° Projeto:</label>
                <input type="text" id="ficha-num" placeholder="Ex: 1000">
                
                <label>Obra:</label>
                <input type="text" id="ficha-obra" placeholder="Ex: Casa Borda da Mata">
                
                <label>Data Início:</label>
                <input type="text" id="ficha-datainicio" placeholder="Ex: 14/08/2025">
                
                <label>Status:</label>
                <input type="text" id="ficha-status" placeholder="Ex: Em Andamento">

                <div class="section-title" style="margin-top: 20px;">2 - Envio do Projeto (Plataformas)</div>
                <label>Plataforma Utilizada:</label>
                <select id="ficha-plataforma">
                    <option value="">Selecione...</option>
                    <option value="Construmanager">Construmanager</option>
                    <option value="Autodoc">Autodoc</option>
                    <option value="Doxmanager">Doxmanager</option>
                    <option value="BiXmanager">BiXmanager</option>
                    <option value="WebProject">WebProject</option>
                    <option value="Timble Connect">Timble Connect</option>
                    <option value="E-mail">E-mail</option>
                    <option value="Outros">Outros</option>
                </select>

                <div class="section-title" style="margin-top: 20px;">4 - Observações do Projeto / E-mails</div>
                <label>Enviar para:</label>
                <textarea id="ficha-obs" rows="3" placeholder="Ex: murilo@rivaltadebarros.com.br; projetos@mfmaisarquitetos.com"></textarea>

                <button id="btn-salvar-ficha" class="btn btn-blue" onclick="salvarFichaTecnica()">Salvar Ficha do Projeto</button>
            </div>
        </div>
        
        <!-- ABA 4: REUNIÕES -->
        <div id="tab-reunioes" class="tab-content">
            <div class="form-section">
                <h2 style="margin: 0 0 15px 0;">Reuniões</h2>
                <button class="btn btn-blue" onclick="alert('Conexão em breve!')">Salvar</button>
            </div>
        </div>

    </div>

    <script>
        const urlScript = "https://script.google.com/macros/s/AKfycbxzD6GmeW0Zbl-vC4_Q107_guVuxRpI1nqhHsPUXmqfhB8b53CvUEwlzbM6EMIN-uFb/exec";
        let memoriaFichas = [];

        function mudarAba(evento, idAba) {
            document.querySelectorAll('.tab-content').forEach(aba => aba.classList.remove('active'));
            document.querySelectorAll('.nav-bar button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(idAba).classList.add('active');
            evento.currentTarget.classList.add('active');
        }

        window.onload = function() {
            fetch(urlScript)
                .then(resposta => resposta.json())
                .then(dados => {
                    // Carrega Projetos
                    const lista = document.getElementById('lista-projetos');
                    lista.innerHTML = ""; 
                    if(!dados.projetos || dados.projetos.length === 0) {
                        lista.innerHTML = "<p style='text-align:center;'>Nenhum projeto cadastrado.</p>";
                    } else {
                        dados.projetos.reverse().forEach(p => { 
                            let isEmUso = p.status.includes('Em uso');
                            let classeStatus = isEmUso ? 'em-uso' : 'livre';
                            let iconeStatus = isEmUso ? '⚠️' : '✅';
                            
                            let botoesDevolver = isEmUso ? `
                                <div style="display:flex; gap:10px; margin-top:15px;">
                                    <button class="btn btn-green" style="margin-top:0;" onclick="devolverProjeto('${p.projeto}', 'CON')">Check-out para TQS CON</button>
                                    <button class="btn btn-green" style="margin-top:0;" onclick="devolverProjeto('${p.projeto}', 'ALV')">Check-out para TQS ALV</button>
                                </div>
                            ` : '';

                            let infoResponsavel = isEmUso ? ` | <strong>Com:</strong> ${p.responsavel}` : '';

                            lista.innerHTML += `
                            <div class="card">
                                <span class="status ${classeStatus}">${iconeStatus} ${p.status}</span>
                                <h2 style="margin: 5px 0;">${p.projeto}</h2>
                                <p class="info"><strong>Modelo:</strong> ${p.modelo || '-'}</p>
                                <p class="info"><strong>Fase:</strong> ${p.fase || '-'} | <strong>Versão:</strong> ${p.versao || '-'}${infoResponsavel}</p>
                                ${botoesDevolver}
                            </div>`;
                        });
                    }

                    // Carrega Fichas Técnicas cadastradas para consulta
                    if(dados.fichas) {
                        memoriaFichas = dados.fichas;
                        const selectFicha = document.getElementById('select-consulta-ficha');
                        selectFicha.innerHTML = '<option value="">-- Criar nova ficha ou selecionar existente --</option>';
                        memoriaFichas.forEach(f => {
                            if(f.projeto) {
                                selectFicha.innerHTML += `<option value="${f.projeto}">${f.projeto} (N° ${f.numProjeto || ''})</option>`;
                            }
                        });
                    }
                });
        };

        function carregarFichaSelecionada() {
            const nomeProj = document.getElementById('select-consulta-ficha').value;
            if(!nomeProj) {
                // Limpa o formulário para nova ficha
                document.getElementById('ficha-projeto').value = "";
                document.getElementById('ficha-num').value = "";
                document.getElementById('ficha-obra').value = "";
                document.getElementById('ficha-datainicio').value = "";
                document.getElementById('ficha-status').value = "";
                document.getElementById('ficha-plataforma').value = "";
                document.getElementById('ficha-obs').value = "";
                return;
            }

            const fichaEncontrada = memoriaFichas.find(f => f.projeto === nomeProj);
            if(fichaEncontrada) {
                document.getElementById('ficha-projeto').value = fichaEncontrada.projeto || "";
                document.getElementById('ficha-num').value = fichaEncontrada.numProjeto || "";
                document.getElementById('ficha-obra').value = fichaEncontrada.obra || "";
                document.getElementById('ficha-datainicio').value = fichaEncontrada.dataInicio || "";
                document.getElementById('ficha-status').value = fichaEncontrada.statusProjeto || "";
                document.getElementById('ficha-plataforma').value = fichaEncontrada.plataforma || "";
                document.getElementById('ficha-obs').value = fichaEncontrada.observacoes || "";
            }
        }

        function salvarFichaTecnica() {
            var projeto = document.getElementById('ficha-projeto').value;
            var numProj = document.getElementById('ficha-num').value;
            var obra = document.getElementById('ficha-obra').value;
            var dataInicio = document.getElementById('ficha-datainicio').value;
            var statusProj = document.getElementById('ficha-status').value;
            var plataforma = document.getElementById('ficha-plataforma').value;
            var obs = document.getElementById('ficha-obs').value;

            if(!projeto.trim()) {
                alert("O Nome do Projeto é obrigatório!");
                return;
            }

            var btn = document.getElementById('btn-salvar-ficha');
            btn.innerText = "Salvando Ficha..."; btn.disabled = true;

            fetch(urlScript, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 
                    'action': 'salvarFicha',
                    'fichaProjeto': projeto,
                    'numProjeto': numProj,
                    'obra': obra,
                    'dataInicio': dataInicio,
                    'statusProjeto': statusProj,
                    'plataforma': plataforma,
                    'observacoes': obs
                })
            }).then(() => {
                btn.innerText = "Salvar Ficha do Projeto"; btn.disabled = false;
                alert("Ficha técnica salva com sucesso!");
                window.location.reload();
            });
        }

        function cadastrarProjeto() {
            var nome = document.getElementById('nomeProjeto').value;
            var modelo = document.getElementById('modeloProjeto').value;
            var fase = document.getElementById('faseProjeto').value;
            var versao = document.getElementById('versaoProjeto').value;
            var responsavel = document.getElementById('responsavelProjeto').value;
            
            var btn = document.getElementById('btn-cadastrar');
            btn.innerText = "Salvando..."; btn.disabled = true;

            fetch(urlScript, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 
                    'action': 'cadastrar', 
                    'nomeProjeto': nome, 'modelo': modelo, 'fase': fase, 'versao': versao, 'responsavel': responsavel 
                })
            }).then(() => {
                btn.innerText = "Registrar Check-in"; btn.disabled = false;
                alert("Check-in realizado com sucesso!");
                window.location.reload();
            });
        }

        function devolverProjeto(nomeProjeto, destino) {
            if(!confirm(`Confirma o Check-out (devolução) do projeto "${nomeProjeto}" para o TQS ${destino}?`)) {
                return; 
            }

            let novoStatus = destino === 'CON' ? '✅ Disponível no TQS CON' : '✅ Disponível no TQS ALV';

            fetch(urlScript, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 
                    'action': 'devolver', 
                    'nomeProjeto': nomeProjeto,
                    'novoStatus': novoStatus
                })
            }).then(() => {
                alert("Check-out realizado com sucesso!");
                window.location.reload();
            });
        }
    </script>
</body>
</html>
