<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle TQS</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 1.5rem; text-align: center; color: #2c3e50; }
        .card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 15px; background: white; }
        .cadastro { background-color: #e2e8f0; border-color: #cbd5e0; }
        
        /* Estilos dos novos campos do formulário */
        label { font-weight: bold; font-size: 0.9rem; margin-top: 10px; display: block; color: #4a5568; }
        input[type="text"] { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 1rem; }
        
        .status { font-weight: bold; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; display: inline-block; margin-bottom: 10px; }
        .status.em-uso { background-color: #fefcbf; color: #b7791f; }
        .status.livre { background-color: #c6f6d5; color: #22543d; }
        .btn { display: block; width: 100%; padding: 10px; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-dark { background-color: #2d3748; color: white; }
        .info { font-size: 0.9rem; margin: 5px 0; color: #4a5568; }
        #carregando { text-align: center; color: #666; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏗️ Controle de Arquivos TQS</h1>
        
        <!-- Formulário Completo -->
        <div class="card cadastro">
            <h2 style="margin: 0 0 10px 0; font-size: 1.2rem;">➕ Iniciar Novo Projeto</h2>
            
            <label>Nome do Projeto:</label>
            <input type="text" id="nomeProjeto" placeholder="Ex: Residencial Alphaville">
            
            <label>Fase:</label>
            <input type="text" id="faseProjeto" placeholder="Ex: Forma, Armação, Plantas...">
            
            <label>Versão:</label>
            <input type="text" id="versaoProjeto" placeholder="Ex: R00">
            
            <label>Responsável:</label>
            <input type="text" id="responsavelProjeto" placeholder="Ex: Marina">
            
            <button id="btn-cadastrar" class="btn btn-dark" onclick="cadastrarProjeto()">Iniciar Projeto (Em Uso)</button>
        </div>

        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">

        <!-- Lista Dinâmica -->
        <div id="lista-projetos">
            <p id="carregando">⏳ Carregando projetos da rede...</p>
        </div>
    </div>

    <script>
        const urlScript = "https://script.google.com/macros/s/AKfycbxzD6GmeW0Zbl-vC4_Q107_guVuxRpI1nqhHsPUXmqfhB8b53CvUEwlzbM6EMIN-uFb/exec";

        function carregarProjetos() {
            fetch(urlScript)
                .then(resposta => resposta.json())
                .then(dados => {
                    const lista = document.getElementById('lista-projetos');
                    lista.innerHTML = ""; 
                    
                    if(dados.length === 0) {
                        lista.innerHTML = "<p style='text-align:center;'>Nenhum projeto cadastrado.</p>";
                        return;
                    }

                    dados.reverse().forEach(p => { 
                        let isEmUso = p.status.includes('Em uso');
                        let classeStatus = isEmUso ? 'em-uso' : 'livre';
                        let iconeStatus = isEmUso ? '⚠️' : '✅';
                        
                        let cardHTML = `
                        <div class="card">
                            <span class="status ${classeStatus}">${iconeStatus} ${p.status}</span>
                            <h2 style="margin: 5px 0;">${p.projeto}</h2>
                            <p class="info"><strong>Fase:</strong> ${p.fase}</p>
                            <p class="info"><strong>Versão Atual:</strong> ${p.versao}</p>
                            <p class="info"><strong>Responsável:</strong> ${p.responsavel}</p>
                        </div>`;
                        lista.innerHTML += cardHTML;
                    });
                });
        }

        function cadastrarProjeto() {
            var nome = document.getElementById('nomeProjeto').value;
            var fase = document.getElementById('faseProjeto').value;
            var versao = document.getElementById('versaoProjeto').value;
            var responsavel = document.getElementById('responsavelProjeto').value;

            // Bloqueia se a pessoa esquecer de preencher o nome
            if(nome.trim() === "") { 
                alert("O Nome do Projeto é obrigatório."); 
                return; 
            }
            
            var btn = document.getElementById('btn-cadastrar');
            btn.innerText = "Salvando..."; btn.disabled = true;

            // Envia todos os dados empacotados para a planilha
            fetch(urlScript, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 
                    'nomeProjeto': nome,
                    'fase': fase,
                    'versao': versao,
                    'responsavel': responsavel
                })
            }).then(() => {
                // Limpa os campos depois de salvar
                document.getElementById('nomeProjeto').value = "";
                document.getElementById('faseProjeto').value = "";
                document.getElementById('versaoProjeto').value = "";
                document.getElementById('responsavelProjeto').value = "";

                btn.innerText = "Iniciar Projeto (Em Uso)";
                btn.disabled = false;
                
                document.getElementById('lista-projetos').innerHTML = "<p id='carregando'>⏳ Atualizando lista...</p>";
                carregarProjetos();
            });
        }

        window.onload = carregarProjetos;
    </script>
</body>
</html>
